<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor GIS</title>
<link rel="icon" type="image/svg+xml" href="icono_electrico.svg">
<link rel="stylesheet" href="lib/leaflet.css">
<style>
  html,body{height:100%;margin:0;font-family:system-ui,sans-serif}
  #map{height:100%}
  #logo{position:absolute;z-index:1000;top:10px;left:10px;height:84px;display:none;background:rgba(255,255,255,.92);border-radius:8px;box-shadow:0 1px 6px rgba(0,0,0,.45);padding:6px 10px;box-sizing:border-box}
  #logo.ok{display:block}
  body.conlogo .leaflet-top.leaflet-left{top:94px}   /* zoom y muñeco debajo del logo */
  #logo img{height:100%;display:block}
  #buscador{position:absolute;z-index:1100;top:10px;left:50%;transform:translateX(-50%);width:min(420px,calc(100vw - 120px))}
  #q{width:100%;box-sizing:border-box;padding:9px 34px 9px 12px;font-size:15px;border:0;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.4);outline:none}
  #qx{position:absolute;right:4px;top:3px;border:0;background:none;font-size:22px;color:#888;cursor:pointer;display:none}
  #res{background:#fff;border-radius:6px;margin-top:4px;box-shadow:0 1px 5px rgba(0,0,0,.4);max-height:55vh;overflow:auto;display:none}
  #res div{padding:7px 12px;border-bottom:1px solid #eee;cursor:pointer;font-size:13px}
  #res div:hover,#res div.sel{background:#fff3e6}
  #res b{display:block;font-size:14px}
  #res small{color:#666}
  #res mark{background:#ffe08a;padding:0}
  #res .info{color:#888;cursor:default}
  @media(max-width:760px){#logo{display:none!important} body.conlogo .leaflet-top.leaflet-left{top:0}}
  #filtros{position:absolute;z-index:1000;top:150px;right:10px;background:#fff;border-radius:6px;box-shadow:0 1px 5px rgba(0,0,0,.4);width:230px;font-size:13px}
  #filtros summary{padding:8px 12px;font-weight:600;cursor:pointer;list-style:none}
  #filtros summary::-webkit-details-marker{display:none}
  #filtros .cuerpo{padding:0 12px 10px}
  #filtros label{display:block;margin-top:7px;color:#555;font-size:12px}
  #filtros select{width:100%;padding:5px;font-size:13px;margin-top:2px}
  #filtros .pie{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  #filtros button{border:1px solid #ccc;background:#f7f7f7;border-radius:4px;padding:4px 10px;cursor:pointer}
  #cuenta{color:#666}
  #panelfotos{position:absolute;z-index:1050;top:0;left:0;bottom:0;width:360px;background:#fff;box-shadow:2px 0 8px rgba(0,0,0,.35);transform:translateX(-105%);transition:transform .25s;display:flex;flex-direction:column}
  body.conpanel #panelfotos{transform:none}
  #panelfotos header{padding:12px 44px 12px 14px;background:#0b5394;color:#fff;font-weight:600;font-size:15px;position:relative}
  #panelfotos header small{display:block;font-weight:400;opacity:.85;font-size:12px;margin-top:2px}
  #pfx{position:absolute;right:6px;top:6px;border:0;background:none;color:#fff;font-size:26px;cursor:pointer;line-height:1}
  #pfcuerpo{overflow:auto;padding:12px;flex:1}
  #pfcuerpo figure{margin:0 0 14px}
  #pfcuerpo figcaption{font-weight:600;margin-bottom:5px;color:#0b5394}
  #pfcuerpo img{width:100%;border-radius:6px;cursor:zoom-in;display:block;background:#eee;min-height:80px}
  #pfcuerpo .vacio{color:#777;text-align:center;margin-top:30px}
  body.conpanel #logo.ok{display:none}
  body.conpanel #buscador{left:calc(360px + (100vw - 360px)/2);width:min(420px,calc(100vw - 360px - 130px))}
  body.conpanel.conlogo .leaflet-top.leaflet-left{top:0}
  body.conpanel .leaflet-left .leaflet-control{margin-left:360px}
  @media(max-width:760px){
    #panelfotos{top:auto;width:auto;right:0;height:46vh;transform:translateY(105%)}
    body.conpanel .leaflet-left .leaflet-control{margin-left:10px}
    #filtros{top:auto;bottom:30px;right:10px;width:190px}
    body.conpanel #buscador{left:50%;width:min(420px,calc(100vw - 120px))}
    body.conpanel #filtros{display:none}
  }
  .leaflet-control-pegman{background:#fff;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:4px;box-shadow:0 1px 5px rgba(0,0,0,.65)}
  .leaflet-control-pegman:hover{background:#f4f4f4}
  .leaflet-control-pegman.on{background:#fff3b0;box-shadow:0 0 0 2px #f9a825}
  body.svmodo #map{cursor:crosshair}
  #svayuda{position:absolute;z-index:1200;bottom:30px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;display:none}
  body.svmodo #svayuda{display:block}
  .btnsv{display:flex;align-items:center;gap:8px;width:100%;box-sizing:border-box;margin:0 0 12px;padding:8px 12px;border:1px solid #ccc;border-radius:6px;background:#f7f7f7;cursor:pointer;font-size:13px}
  .btnsv:hover{background:#eee}
  .nodisp{position:relative;width:100%;aspect-ratio:4/3;border-radius:6px;background:repeating-linear-gradient(45deg,#f1f1f1 0 14px,#e6e6e6 14px 28px);border:1px dashed #bbb;box-sizing:border-box;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .nodisp span{transform:rotate(-30deg);font-size:26px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#9a9a9a;white-space:nowrap}
  .leaflet-marker-icon{filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
  .pop{max-width:260px}
  .pop h3{margin:0 0 6px;font-size:16px}
  .pop table{border-collapse:collapse;font-size:12px;width:100%}
  .pop td{border-bottom:1px solid #eee;padding:2px 4px;vertical-align:top}
  .pop td:first-child{color:#666;white-space:nowrap}
  .fotos{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
  .fotos figure{margin:0;text-align:center;font-size:11px;color:#555}
  .fotos img{width:78px;height:78px;object-fit:cover;border-radius:4px;cursor:zoom-in}
  #lb{display:none;position:fixed;inset:0;z-index:5000;background:rgba(0,0,0,.88);align-items:center;justify-content:center}
  #lb.on{display:flex}
  #lb img{max-width:92vw;max-height:90vh}
  #lb button{position:absolute;top:10px;background:none;border:0;color:#fff;font-size:34px;cursor:pointer;padding:6px 14px}
  #lbx{right:10px} #lbp{left:10px;top:45%} #lbn{right:10px;top:45%}
  #err{position:absolute;z-index:1000;bottom:10px;left:10px;background:#fee;border:1px solid #c33;padding:6px 10px;border-radius:6px;display:none;max-width:80vw}
</style>
</head>
<body>
<div id="map"></div>
<div id="logo"><img id="logoimg" alt="Logo"></div>
<div id="buscador"><input id="q" type="search" placeholder="Buscar en todos los campos..." autocomplete="off"><button id="qx" title="Borrar">×</button><div id="res"></div></div>
<details id="filtros" open><summary>Filtros</summary><div class="cuerpo"><div id="selects"></div><div class="pie"><span id="cuenta"></span><button id="limpiar">Limpiar</button></div></div></details>
<aside id="panelfotos"><header><span id="pft"></span><small id="pfs"></small><button id="pfx" title="Cerrar">×</button></header><div id="pfcuerpo"></div></aside>
<div id="svayuda">Haz clic en el mapa para abrir Street View · Esc para cancelar</div>
<div id="err"></div>
<div id="lb"><button id="lbx">×</button><button id="lbp">‹</button><img id="lbi" alt=""><button id="lbn">›</button></div>

<script src="lib/leaflet.js"></script>
<script src="lib/shp.min.js"></script>
<script src="config.js"></script>
<script src="data/puntos.js"></script>
<script>
const v = Date.now(); // evita que el navegador use datos antiguos
document.title = CONFIG.titulo;
if (CONFIG.logo) {
  const li=document.getElementById('logoimg');
  li.onload=()=>{ document.getElementById('logo').classList.add('ok'); document.body.classList.add('conlogo'); };
  li.src=CONFIG.logo;
}

const map = L.map('map',{maxZoom: CONFIG.zoomMax||21}).setView(CONFIG.centro, CONFIG.zoom);
// Mapa base de calles: OpenStreetMap estándar. OSM rechaza (403) las peticiones sin Referer, que es lo que pasa
// al abrir index.html con doble clic (file://); en ese caso, o si OSM falla, se usa CARTO (mismos datos de OSM).
const carto = () => L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {maxZoom:22, maxNativeZoom:19, subdomains:'abcd', attribution:'© OpenStreetMap © CARTO'});
let calles;
if (location.protocol.startsWith('http')) {
  calles = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:22, maxNativeZoom:19, attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
  calles.once('tileerror', () => { const tenia = map.hasLayer(calles); map.removeLayer(calles); calles = carto(); if (tenia) calles.addTo(map); });
} else calles = carto();
calles.addTo(map);
const overlays = {};

// Ortofoto (WMS)
if (CONFIG.wms.url) {
  overlays[CONFIG.wms.nombre] = L.tileLayer.wms(CONFIG.wms.url, {
    layers: CONFIG.wms.capas, format: CONFIG.wms.formato, transparent: CONFIG.wms.formato==='image/png', keepBuffer: 4,
    opacity: CONFIG.wms.opacidad, version: '1.1.1',
    tileSize: 512, zIndex: 5, maxZoom: 22   // teselas de 512 px: 4 veces menos peticiones al servidor
  });
  if (CONFIG.wms.activa) overlays[CONFIG.wms.nombre].addTo(map);
}
// Viales: carreteras y nombres de calles (capa de referencia de Esri, fondo transparente), encima de la ortofoto
overlays['Viales'] = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {maxZoom:22, maxNativeZoom:19, zIndex: 10, attribution:'Esri'});
if (CONFIG.vialesActivos !== false) overlays['Viales'].addTo(map);
const ctrl = L.control.layers(null, overlays, {collapsed:false}).addTo(map);

// ---- Google Maps como base (vía oficial: Maps JavaScript API con clave propia) ----
if (CONFIG.googleApiKey) {
  const carga = src => new Promise((ok, ko) => { const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=ko; document.head.appendChild(s); });
  let gCalles = null;
  window.gm_authFailure = () => {   // clave rechazada: volver al mapa CARTO
    error('Google Maps rechazó la clave (revisa la clave y sus restricciones en Google Cloud). Se usa el mapa CARTO.');
    if (gCalles) map.removeLayer(gCalles);
    calles.addTo(map);
  };
  carga('https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(CONFIG.googleApiKey)+'&loading=async&callback=Function.prototype')
    .then(() => carga('https://unpkg.com/leaflet.gridlayer.googlemutant@0.14.1/dist/Leaflet.GoogleMutant.js'))
    .then(() => { gCalles = L.gridLayer.googleMutant({type:'roadmap', maxZoom:21}); map.removeLayer(calles); gCalles.addTo(map); })
    .catch(() => console.warn('No se pudo cargar Google Maps; se mantiene el mapa base CARTO.'));
}

function error(m){ const e=document.getElementById('err'); e.textContent=m; e.style.display='block'; console.error(m); }

// ---- Lightbox ----
let gal=[], gi=0;
const lb=document.getElementById('lb'), lbi=document.getElementById('lbi');
function abrir(arr,i){ gal=arr; gi=i; lbi.src=gal[gi]; lb.classList.add('on'); }
function mover(d){ gi=(gi+d+gal.length)%gal.length; lbi.src=gal[gi]; }
document.getElementById('lbx').onclick=()=>lb.classList.remove('on');
document.getElementById('lbp').onclick=()=>mover(-1);
document.getElementById('lbn').onclick=()=>mover(1);
lb.onclick=e=>{ if(e.target===lb) lb.classList.remove('on'); };
document.addEventListener('keydown',e=>{ if(!lb.classList.contains('on'))return;
  if(e.key==='Escape')lb.classList.remove('on'); if(e.key==='ArrowLeft')mover(-1); if(e.key==='ArrowRight')mover(1); });

// ---- Popup ----
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function listaFotos(p){
  const out=[];
  for(const g of CONFIG.fotos){
    const raw=p[g.campo]; if(!raw) continue;
    String(raw).split(/[;|]/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
      s=s.replace(/\\/g,'/').split('/').pop().replace(/\.[^.]+$/,'');
      out.push({etq:g.etiqueta, grande:g.carpeta+encodeURIComponent(s)+'.jpg', mini:g.carpeta+'mini/'+encodeURIComponent(s)+'.jpg'});
    });
  }
  return out;
}
function popup(f){
  const p=f.properties||{};
  const campoFoto=new Set(CONFIG.fotos.map(g=>g.campo));
  const t=p[CONFIG.campoTitulo];
  const filas=Object.entries(p).filter(([k,val])=>!campoFoto.has(k) && k!==CONFIG.campoTitulo && !CONFIG.ocultar.includes(k) && val!==null && val!=='')
    .map(([k,val])=>`<tr><td>${esc(k)}</td><td>${esc(val)}</td></tr>`).join('');
  const div=document.createElement('div'); div.className='pop';
  div.innerHTML=(t?`<h3>${esc(t)}</h3>`:'')+(filas?`<table>${filas}</table>`:'');
  return div;
}



// ---- Filtros (estado compartido con el buscador) ----
const filtroActivo = {};
const pasaFiltro = p => Object.entries(filtroActivo).every(([k,v]) => !v || String(p[k]??'').trim() === v);
let alCambiarFiltro = () => {};

// ---- Buscador (todos los campos, sin mayúsculas ni acentos, varias palabras) ----
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function iniciarBuscador(capa){
  const items=[];
  capa.eachLayer(l=>{
    const p=l.feature.properties||{};
    items.push({l, p, texto:norm(Object.values(p).filter(v=>v!==null&&v!=='').join(' | '))});
  });
  const q=document.getElementById('q'), res=document.getElementById('res'), qx=document.getElementById('qx');
  let sel=-1, lista=[];
  function resaltar(txt,pal){
    let s=esc(txt);
    pal.forEach(w=>{ const n=norm(txt); const i=n.indexOf(w); if(i>=0) s=esc(txt.slice(0,i))+'<mark>'+esc(txt.slice(i,i+w.length))+'</mark>'+esc(txt.slice(i+w.length)); });
    return s;
  }
  function buscar(){
    const pal=norm(q.value).split(/\s+/).filter(Boolean);
    qx.style.display=q.value?'block':'none'; sel=-1;
    if(!pal.length){res.style.display='none';return;}
    lista=items.filter(it=>pasaFiltro(it.p)&&pal.every(w=>it.texto.includes(w)));
    res.innerHTML='';
    if(!lista.length){res.innerHTML='<div class="info">Sin resultados</div>';}
    else{
      lista.slice(0,30).forEach((it,i)=>{
        // primer campo (distinto del título) donde coincide
        const tit=it.p[CONFIG.campoTitulo]||'(sin nombre)';
        let hit=Object.entries(it.p).find(([k,v])=>v!==null&&v!==''&&k!==CONFIG.campoTitulo&&pal.some(w=>norm(v).includes(w)&&!norm(tit).includes(w)));
        const d=document.createElement('div');
        d.innerHTML='<b>'+resaltar(String(tit),pal)+'</b>'+(hit?'<small>'+esc(hit[0])+': '+resaltar(String(hit[1]),pal)+'</small>':'');
        d.onclick=()=>ir(it); res.appendChild(d);
      });
      if(lista.length>30){const m=document.createElement('div');m.className='info';m.textContent='+'+(lista.length-30)+' más: afina la búsqueda';res.appendChild(m);}
      const c=document.createElement('div');c.className='info';c.textContent=lista.length+' resultado'+(lista.length>1?'s':'')+' (clic aquí para ver todos en el mapa)';
      c.onclick=()=>{ map.fitBounds(L.featureGroup(lista.map(x=>x.l)).getBounds().pad(.2)); res.style.display='none'; };
      res.insertBefore(c,res.firstChild);
    }
    res.style.display='block';
  }
  function ir(it){
    res.style.display='none';
    map.setView(it.l.getLatLng(),Math.max(map.getZoom(),Math.min(CONFIG.zoomAlBuscar||16,CONFIG.zoomMax||21)));
    it.l.openPopup();
  }
  alCambiarFiltro=()=>{ if(q.value) buscar(); };
  q.addEventListener('input',buscar);
  q.addEventListener('focus',()=>{ if(q.value) buscar(); });
  q.addEventListener('keydown',e=>{
    const ds=[...res.querySelectorAll('div:not(.info)')];
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); if(!ds.length)return;
      sel=(sel+(e.key==='ArrowDown'?1:-1)+ds.length)%ds.length; ds.forEach((d,i)=>d.classList.toggle('sel',i===sel)); ds[sel].scrollIntoView({block:'nearest'}); }
    else if(e.key==='Enter'&&lista.length){ ir(lista[sel>=0?sel:0]); }
    else if(e.key==='Escape'){ res.style.display='none'; q.blur(); }
  });
  qx.onclick=()=>{ q.value=''; buscar(); q.focus(); };
  L.DomEvent.disableClickPropagation(document.getElementById('buscador'));
  L.DomEvent.disableScrollPropagation(res);
  document.addEventListener('click',e=>{ if(!document.getElementById('buscador').contains(e.target)) res.style.display='none'; });
}


function iniciarFiltros(capa){
  const todos=[]; capa.eachLayer(l=>todos.push(l));
  const cont=document.getElementById('selects'), cuenta=document.getElementById('cuenta');
  const campos=(CONFIG.filtros||[]).filter(c=>todos.some(l=>(l.feature.properties||{})[c]));
  if(!campos.length){ document.getElementById('filtros').style.display='none'; return; }
  campos.forEach(c=>{
    const cnt={}; todos.forEach(l=>{ const v=String((l.feature.properties||{})[c]??'').trim(); if(v) cnt[v]=(cnt[v]||0)+1; });
    const lab=document.createElement('label'); lab.textContent=c.replace(/_/g,' ');
    const sel=document.createElement('select'); sel.dataset.campo=c;
    sel.innerHTML='<option value="">Todos</option>'+Object.keys(cnt).sort((a,b)=>a.localeCompare(b,'es')).map(v=>`<option value="${esc(v)}">${esc(v)} (${cnt[v]})</option>`).join('');
    sel.onchange=aplicar; lab.appendChild(sel); cont.appendChild(lab);
  });
  function aplicar(ajustar=true){
    cont.querySelectorAll('select').forEach(s=>{ if(s.value) filtroActivo[s.dataset.campo]=s.value; else delete filtroActivo[s.dataset.campo]; });
    const vis=[]; todos.forEach(l=>{ if(pasaFiltro(l.feature.properties||{})){ capa.addLayer(l); vis.push(l); } else capa.removeLayer(l); });
    cuenta.textContent=vis.length+' de '+todos.length+' puntos';
    map.closePopup();
    if(Object.keys(filtroActivo).length && vis.length && ajustar!==false) map.fitBounds(L.featureGroup(vis).getBounds().pad(.3),{maxZoom:CONFIG.zoomAlBuscar||16});
    alCambiarFiltro();
  }
  document.getElementById('limpiar').onclick=()=>{ cont.querySelectorAll('select').forEach(s=>s.value=''); aplicar(false); if(todos.length) map.fitBounds(capa.getBounds().pad(.2)); };
  cuenta.textContent=todos.length+' de '+todos.length+' puntos';
  L.DomEvent.disableClickPropagation(document.getElementById('filtros'));
}

// ---- Street View (muñeco amarillo) ----
const PEGMAN='<svg width="22" height="22" viewBox="0 0 24 24"><circle cx="12" cy="4.2" r="2.8" fill="#f9a825" stroke="#b36b00" stroke-width="1"/><path d="M12 8c-2.6 0-4.4 1.3-4.4 3.2V15h2v7h2v-5h.8v5h2v-7h2v-3.8C16.4 9.3 14.6 8 12 8z" fill="#f9a825" stroke="#b36b00" stroke-width="1" stroke-linejoin="round"/></svg>';
const svUrl=(lat,lng)=>'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint='+lat.toFixed(6)+','+lng.toFixed(6);
const svAbrir=(lat,lng)=>window.open(svUrl(lat,lng),'_blank','noopener');
function svModo(on){ document.body.classList.toggle('svmodo',on); const b=document.querySelector('.leaflet-control-pegman'); if(b) b.classList.toggle('on',on); }
const Pegman=L.Control.extend({
  options:{position:'topleft'},
  onAdd(){
    const d=L.DomUtil.create('div','leaflet-control-pegman leaflet-bar'); d.innerHTML=PEGMAN; d.title='Street View: pulsa y haz clic en el mapa';
    L.DomEvent.disableClickPropagation(d);
    d.onclick=()=>svModo(!document.body.classList.contains('svmodo'));
    return d;
  }
});
new Pegman().addTo(map);
map.on('click',e=>{ if(!document.body.classList.contains('svmodo')) return; svModo(false); map.closePopup(); svAbrir(e.latlng.lat,e.latlng.lng); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') svModo(false); });

// ---- Panel lateral de fotos ----
const panel=document.getElementById('panelfotos'), pfc=document.getElementById('pfcuerpo');
function mostrarFotos(f){
  const p=f.properties||{}, fotos=listaFotos(p);
  document.getElementById('pft').textContent=p[CONFIG.campoTitulo]||'Fotos';
  document.getElementById('pfs').textContent=[p[CONFIG.campoSubtitulo]].filter(Boolean).join(', ');
  pfc.innerHTML='';
  if(f.geometry&&f.geometry.type==='Point'){ const [lng,lat]=f.geometry.coordinates; const b=document.createElement('button'); b.className='btnsv'; b.innerHTML=PEGMAN+'<span>Ver este punto en Street View</span>'; b.onclick=()=>svAbrir(lat,lng); pfc.appendChild(b); }
  // Un recuadro por cada tipo de foto (Contador, Armario...). Si no hay foto o no se encuentra: "No disponible".
  const noDisp=fig=>{ const im=fig.querySelector('img'); if(im) im.remove(); if(!fig.querySelector('.nodisp')) fig.insertAdjacentHTML('beforeend','<div class="nodisp"><span>No disponible</span></div>'); };
  CONFIG.fotos.forEach(g=>{
    const delGrupo=fotos.filter(x=>x.etq===g.etiqueta);
    (delGrupo.length?delGrupo:[null]).forEach(x=>{
      const fig=document.createElement('figure');
      fig.innerHTML='<figcaption>'+esc(g.etiqueta)+'</figcaption>';
      pfc.appendChild(fig);
      if(!x){ noDisp(fig); return; }
      const img=new Image(); img.alt=g.etiqueta;
      img.onerror=()=>noDisp(fig);
      img.onclick=()=>{ const imgs=[...pfc.querySelectorAll('img')]; abrir(imgs.map(i=>i.src),imgs.indexOf(img)); };
      img.src=x.grande; fig.appendChild(img);
    });
  });
  pfc.scrollTop=0;
  document.body.classList.add('conpanel');
}
function cerrarPanel(){ document.body.classList.remove('conpanel'); }
document.getElementById('pfx').onclick=()=>{ cerrarPanel(); map.closePopup(); };
map.on('popupopen',e=>{ const s=e.popup._source; if(s&&s.feature) mostrarFotos(s.feature); });
map.on('popupclose',()=>setTimeout(()=>{ if(!map._popup) cerrarPanel(); },0));

// ---- Cargar puntos ----
(async()=>{
  try{
    const url=CONFIG.puntos+'?v='+v;
    let gj;
    if(/\.geojson|\.json$/i.test(CONFIG.puntos)) gj=await (await fetch(url)).json();
    else {
      let buf;
      try{ const r=await fetch(url); if(!r.ok) throw new Error('HTTP '+r.status); buf=await r.arrayBuffer(); }
      catch(e){ // abierto con doble clic (file://): usar la copia incrustada en data/puntos.js
        if(!window.PUNTOS_B64) throw e;
        buf=Uint8Array.from(atob(window.PUNTOS_B64),c=>c.charCodeAt(0)).buffer;
      }
      gj=await shp(buf);
    }
    if(Array.isArray(gj)) gj={type:'FeatureCollection',features:gj.flatMap(g=>g.features)};
    const capa=L.geoJSON(gj,{
      pointToLayer:(f,ll)=> CONFIG.iconoPuntos
        ? L.marker(ll,{icon:L.icon({iconUrl:CONFIG.iconoPuntos, iconSize:[36,30], iconAnchor:[18,15], popupAnchor:[0,-14]}), title:(f.properties||{})[CONFIG.campoTitulo]||''})
        : L.circleMarker(ll,{radius:7,color:'#fff',weight:2,fillColor:'#e8590c',fillOpacity:1}),
      onEachFeature:(f,l)=>l.bindPopup(()=>popup(f),{maxWidth:280})
    }).addTo(map);
    ctrl.addOverlay(capa, CONFIG.nombrePuntos||'Puntos');
    iniciarBuscador(capa);
    iniciarFiltros(capa);
    if(capa.getBounds().isValid() && !CONFIG.wms.url) map.fitBounds(capa.getBounds().pad(.2));
    else if(capa.getBounds().isValid()) map.fitBounds(capa.getBounds().pad(.5));
  }catch(e){ error('No se pudieron cargar los puntos ('+CONFIG.puntos+'): '+e.message); }
})();
</script>
